name: Rust

# What this runs, and what it deliberately does NOT run.
#
# This project's engine is pure Rust — no system libraries, no FFmpeg, no model — so `cargo build`
# plus `cargo test` covers it: 61 tests, and the parser instrument `rustranslator parse` needs
# nothing but the binary.
#
# NOT covered here, on purpose:
#   * tests/tier2_test.py — needs the `mcp` python client and a running server;
#   * anything that calls a provider — the translator and the reviewer need an endpoint, and a
#     cloud reviewer needs a credential;
#   * the parser differential against the 262-block corpus — it needs the corpus, which lives in the
#     user's data directory, not in the repository.
# Those are run by hand and documented in the README. A green check that silently skipped them
# would be worth less than none.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: cargo build --release --verbose

      - name: Run the tests
        run: cargo test --release --verbose

      - name: Smoke — the binary starts and prints its help
        # `cargo build` without --release only fills target/debug, and `cargo test --release` builds
        # the test harness rather than the executable, so the first version of this step looked for a
        # file that was never produced. The profile is what a release ships: build it as one.
        run: ./target/release/rustranslator --help
