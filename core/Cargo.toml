[package]
name = "rustranslator-core"
description = "Translation engine: markdown block parser, local translator, cloud reviewer, resumable registry."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The block parser's anchors, and the protection of markdown slots. `regex` is chosen for its
# guarantee of linear time — no backtracking — which is exactly why it has no lookaround; the
# patterns here are written to work without it.
regex = "1"
# HTTP client. `rustls` is pure Rust: it does not depend on the system's OpenSSL, which matters
# because this binary also ships packaged.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
